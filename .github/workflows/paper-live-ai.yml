name: Paper Live AI Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "AI provider"
        required: false
        default: "groq"
        type: choice
        options:
          - groq
          - google
      duration_minutes:
        description: "Live market observation duration"
        required: false
        default: "10"
        type: string
      max_candidates:
        description: "Maximum AI candidates per research cycle"
        required: false
        default: "4"
        type: string

jobs:
  paper-live-ai:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRADINGAGENTS_ENABLED: "1"
      PAPER_LIVE_MAX_CONCURRENT: "2"
      MARKET_PRODUCTS: "BTC-USD,ETH-USD,SOL-USD,BNB-USD,XRP-USD,ADA-USD,DOGE-USD,AVAX-USD,LINK-USD,SUI-USD"
      TRADINGAGENTS_PYTHON: "python3"
      TRADINGAGENTS_RUNNER_SCRIPT: "Python/tradingagents_runner.py"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure paper evaluation inputs
        shell: bash
        run: |
          provider="${{ inputs.provider }}"
          duration="${{ inputs.duration_minutes }}"
          max_candidates="${{ inputs.max_candidates }}"
          provider="${provider:-groq}"
          duration="${duration:-10}"
          max_candidates="${max_candidates:-4}"
          case "$provider" in
            groq|google) ;;
            *) echo "Unsupported provider: $provider"; exit 1 ;;
          esac
          [[ "$duration" =~ ^[0-9]+$ ]] && [ "$duration" -ge 1 ] || { echo "duration_minutes must be >= 1"; exit 1; }
          [[ "$max_candidates" =~ ^[0-9]+$ ]] && [ "$max_candidates" -ge 1 ] || { echo "max_candidates must be >= 1"; exit 1; }
          echo "TRADINGAGENTS_LLM_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "PAPER_LIVE_DURATION_MS=$((duration * 60000))" >> "$GITHUB_ENV"
          echo "PAPER_LIVE_MAX_CANDIDATES=$max_candidates" >> "$GITHUB_ENV"

      - name: Check provider secret
        shell: bash
        run: |
          if [ "$TRADINGAGENTS_LLM_PROVIDER" = "groq" ]; then
            test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY secret is missing"; exit 1; }
          else
            test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY secret is missing"; exit 1; }
          fi

      - name: Install Node dependencies
        run: npm install

      - name: Install TradingAgents v0.4.0
        run: python3 -m pip install -r Python/requirements.txt

      - name: Canonical architecture and paper safety checks
        run: |
          node --check Src/index.js
          node --check Src/TradeDecisionGate.js
          node --check Src/PaperLiveResearchEngine.js
          node --check Src/AIPerformanceJournal.js
          node --check Src/run-paper-live-ai.js
          node --check Src/MarketFeed.js
          python3 -m py_compile Python/tradingagents_runner.py
          node Src/TradeDecisionGate.test.js
          node Src/PaperLiveResearchEngine.test.js
          node Src/AIPerformanceJournal.test.js
          node Src/TradingAgentsAdapter.test.js

      - name: Run live-market paper AI evaluation
        run: node Src/run-paper-live-ai.js

      - name: Upload empirical AI journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-performance-journal
          path: data/ai-performance-journal.jsonl
          if-no-files-found: ignore
