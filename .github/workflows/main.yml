name: DEX Bot Paper Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node
        run: node --version

      - name: Check Python bridge
        run: |
          python3 --version
          python3 -m py_compile Python/tradingagents_runner.py
          test -f Python/requirements.txt

      - name: Install
        run: npm install

      - name: Check Bot Files
        run: |
          test -f Src/index.js
          test -f Src/MultiCoinCandidateEngine.js
          test -f Src/MultiCoinCandidateEngine.test.js
          test -f Src/MultiCoinCandidateEngine.benchmark.test.js
          test -f Src/AIResearchRouter.js
          test -f Src/AIResearchRouter.test.js
          test -f Src/MultiCoinResearchPipeline.js
          test -f Src/MultiCoinResearchPipeline.test.js
          test -f Src/PaperLiveResearchEngine.js
          test -f Src/PaperLiveResearchEngine.test.js
          test -f Src/AIPerformanceJournal.js
          test -f Src/AIPerformanceJournal.test.js
          test -f Src/PaperPerformanceJournal.js
          test -f Src/PaperPerformanceJournal.test.js
          test -f Src/FastCandidatePipeline.js
          test -f Src/FastCandidatePipeline.test.js
          test -f Src/SignalEngine.js
          test -f Src/SignalEngine.test.js
          test -f Src/SignalFusion.js
          test -f Src/SignalFusion.test.js
          test -f Src/MarketRegimeEngine.js
          test -f Src/MarketRegimeEngine.test.js
          test -f Src/DecisionMemory.js
          test -f Src/DecisionMemory.test.js
          test -f Src/AgentPerformance.js
          test -f Src/AgentPerformance.test.js
          test -f Src/DataQualityGate.js
          test -f Src/DataQualityGate.test.js
          test -f Src/GeckoTerminalDataAdapter.js
          test -f Src/GeckoTerminalDataAdapter.test.js
          test -f Src/GoPlusTokenSecurityAdapter.js
          test -f Src/GoPlusTokenSecurityAdapter.test.js
          test -f Src/TokenSafetyScanner.js
          test -f Src/TokenSafetyScanner.test.js
          test -f Src/TradingAgentsAdapter.js
          test -f Src/TradingAgentsAdapter.test.js
          test -f Src/EvmRpcHealthAdapter.js
          test -f Src/EvmRpcHealthAdapter.test.js

      - name: Syntax Check
        run: |
          node --check Src/index.js
          node --check Src/MultiCoinCandidateEngine.js
          node --check Src/MultiCoinCandidateEngine.test.js
          node --check Src/MultiCoinCandidateEngine.benchmark.test.js
          node --check Src/AIResearchRouter.js
          node --check Src/AIResearchRouter.test.js
          node --check Src/MultiCoinResearchPipeline.js
          node --check Src/MultiCoinResearchPipeline.test.js
          node --check Src/PaperLiveResearchEngine.js
          node --check Src/PaperLiveResearchEngine.test.js
          node --check Src/AIPerformanceJournal.js
          node --check Src/AIPerformanceJournal.test.js
          node --check Src/PaperPerformanceJournal.js
          node --check Src/PaperPerformanceJournal.test.js
          node --check Src/FastCandidatePipeline.js
          node --check Src/FastCandidatePipeline.test.js
          node --check Src/SignalEngine.js
          node --check Src/SignalEngine.test.js
          node --check Src/SignalFusion.js
          node --check Src/SignalFusion.test.js
          node --check Src/MarketRegimeEngine.js
          node --check Src/MarketRegimeEngine.test.js
          node --check Src/DecisionMemory.js
          node --check Src/DecisionMemory.test.js
          node --check Src/AgentPerformance.js
          node --check Src/AgentPerformance.test.js
          node --check Src/DataQualityGate.js
          node --check Src/GeckoTerminalDataAdapter.js
          node --check Src/GeckoTerminalDataAdapter.test.js
          node --check Src/GoPlusTokenSecurityAdapter.js
          node --check Src/GoPlusTokenSecurityAdapter.test.js
          node --check Src/TokenSafetyScanner.js
          node --check Src/TokenSafetyScanner.test.js
          node --check Src/TradingAgentsAdapter.js
          node --check Src/TradingAgentsAdapter.test.js
          node --check Src/EvmRpcHealthAdapter.js
          node --check Src/EvmRpcHealthAdapter.test.js

      - name: EVM RPC Health Adapter Unit Test
        run: node Src/EvmRpcHealthAdapter.test.js
      - name: GoPlus Token Security Adapter Unit Test
        run: node Src/GoPlusTokenSecurityAdapter.test.js
      - name: Token Safety Unit Test
        run: node Src/TokenSafetyScanner.test.js
      - name: Capital Flow Unit Test
        run: node Src/CapitalFlowScanner.test.js
      - name: On-chain Adapter Unit Test
        run: node Src/OnchainDataAdapter.test.js
      - name: On-chain Flow Integration Test
        run: node Src/OnchainFlowIntegration.test.js
      - name: GeckoTerminal Adapter Unit Test
        run: node Src/GeckoTerminalDataAdapter.test.js
      - name: DEX Flow Monitor Unit Test
        run: node Src/DexFlowMonitor.test.js
      - name: Fast Candidate Scorer Unit Test
        run: node Src/FastCandidateScorer.test.js
      - name: Fast Discovery Engine Unit Test
        run: node Src/FastDiscoveryEngine.test.js
      - name: Multi-Coin Candidate Engine Unit Test
        run: node Src/MultiCoinCandidateEngine.test.js
      - name: Multi-Coin 10k Benchmark
        run: node Src/MultiCoinCandidateEngine.benchmark.test.js
      - name: AI Research Router Unit Test
        run: node Src/AIResearchRouter.test.js
      - name: Multi-Coin Research Pipeline Unit Test
        run: node Src/MultiCoinResearchPipeline.test.js
      - name: Paper Live Research Engine Unit Test
        run: node Src/PaperLiveResearchEngine.test.js
      - name: AI Performance Journal Unit Test
        run: node Src/AIPerformanceJournal.test.js
      - name: Paper Performance Journal Unit Test
        run: node Src/PaperPerformanceJournal.test.js
      - name: Fast Candidate Pipeline Unit Test
        run: node Src/FastCandidatePipeline.test.js
      - name: Signal Engine Unit Test
        run: node Src/SignalEngine.test.js
      - name: Signal Fusion Unit Test
        run: node Src/SignalFusion.test.js
      - name: Market Regime Unit Test
        run: node Src/MarketRegimeEngine.test.js
      - name: Decision Memory Unit Test
        run: node Src/DecisionMemory.test.js
      - name: Agent Performance Unit Test
        run: node Src/AgentPerformance.test.js
      - name: TradingAgents Adapter Unit Test
        run: node Src/TradingAgentsAdapter.test.js
      - name: Trade Decision Gate Unit Test
        run: node Src/TradeDecisionGate.test.js
      - name: Statistical Journal Unit Test
        run: node Src/StatisticalJournal.test.js
      - name: Statistical Edge Engine Unit Test
        run: node Src/StatisticalEdgeEngine.test.js
      - name: Market Data Quality Gate Unit Test
        run: node Src/DataQualityGate.test.js
      - name: Paper data persistence smoke test
        run: |
          rm -rf data/ci-paper
          RUN_ONCE=1 PAPER_PERFORMANCE_PATH=data/ci-paper/paper-performance.jsonl node Src/index.js
          test -s data/ci-paper/paper-performance.jsonl
      - name: Dashboard Smoke Test
        run: RUN_ONCE=1 node Src/index.js
      - name: Paper Bot Smoke Test
        run: RUN_ONCE=1 BOT_MODE=paper node Src/index.js
      - name: Test completed
        run: echo "All DEX bot paper tests completed successfully"
