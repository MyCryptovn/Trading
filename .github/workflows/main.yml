name: DEX Bot Paper Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check Node
        run: node --version

      - name: Install
        run: npm install

      - name: Check Bot Files
        run: |
          test -f package.json
          test -f Src/index.js
          test -f Src/config.js
          test -f Src/maket.js
          test -f Src/Strategy.js
          test -f Src/Papertrader.js
          test -f Src/logger.js

      - name: Syntax Check
        run: node --check Src/index.js

      - name: Paper Bot Smoke Test
        run: npm test
        env:
          BOT_MODE: paper
          ASSET: BTC
          START_BALANCE_USD: 1000
          BUY_DROP_PCT: 2
          SELL_RISE_PCT: 3

      - name: Test completed
        run: echo "Paper bot smoke test completed successfully"
