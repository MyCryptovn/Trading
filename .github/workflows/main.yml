DEX Bot Paper Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node
        run: node --version

      - name: Install
        run: npm install

      - name: Start Paper Bot
        run: |
          timeout 90s npm start

      - name: Test completed
        run: echo "Paper bot test completed successfully"
