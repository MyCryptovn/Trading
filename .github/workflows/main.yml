name: DEX Bot Paper Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node
        run: node --version

      - name: Install
        run: npm install

      - name: Check Bot Files
        run: |
          test -f package.json
          test -f Src/index.js
          test -f Src/config.js
          test -f Src/maket.js
          test -f Src/Strategy.js
          test -f Src/Papertrader.js
          test -f Src/TradingCosts.js
          test -f Src/RiskEngine.js
          test -f Src/TokenSafetyScanner.js
          test -f Src/TokenSafetyScanner.test.js
          test -f Src/CapitalFlowScanner.js
          test -f Src/CapitalFlowScanner.test.js
          test -f Src/OnchainDataAdapter.js
          test -f Src/OnchainDataAdapter.test.js
          test -f Src/OnchainFlowIntegration.js
          test -f Src/OnchainFlowIntegration.test.js
          test -f Src/GeckoTerminalDataAdapter.js
          test -f Src/GeckoTerminalDataAdapter.test.js
          test -f Src/DexFlowMonitor.js
          test -f Src/DexFlowMonitor.test.js
          test -f Src/FastCandidateScorer.js
          test -f Src/FastCandidateScorer.test.js
          test -f Src/FastDiscoveryEngine.js
          test -f Src/FastDiscoveryEngine.test.js
          test -f Src/TradeDecisionGate.js
          test -f Src/TradeDecisionGate.test.js
          test -f Src/StatisticalEdgeEngine.js
          test -f Src/StatisticalEdgeEngine.test.js
          test -f Src/DashboardServer.js
          test -f Src/DashboardServer.test.js
          test -f public/index.html
          test -f Src/MarketFeed.js
          test -f Src/MarketScanner.js
          test -f Src/SignalEngine.js
          test -f Src/logger.js

      - name: Syntax Check
        run: |
          node --check Src/index.js
          node --check Src/DashboardServer.js
          node --check Src/DashboardServer.test.js
          node --check Src/Papertrader.js
          node --check Src/RiskEngine.js
          node --check Src/TokenSafetyScanner.js
          node --check Src/TokenSafetyScanner.test.js
          node --check Src/CapitalFlowScanner.js
          node --check Src/CapitalFlowScanner.test.js
          node --check Src/OnchainDataAdapter.js
          node --check Src/OnchainDataAdapter.test.js
          node --check Src/OnchainFlowIntegration.js
          node --check Src/OnchainFlowIntegration.test.js
          node --check Src/GeckoTerminalDataAdapter.js
          node --check Src/GeckoTerminalDataAdapter.test.js
          node --check Src/DexFlowMonitor.js
          node --check Src/DexFlowMonitor.test.js
          node --check Src/FastCandidateScorer.js
          node --check Src/FastCandidateScorer.test.js
          node --check Src/FastDiscoveryEngine.js
          node --check Src/FastDiscoveryEngine.test.js
          node --check Src/TradeDecisionGate.js
          node --check Src/TradeDecisionGate.test.js
          node --check Src/StatisticalEdgeEngine.js
          node --check Src/StatisticalEdgeEngine.test.js
          node --check Src/MarketFeed.js
          node --check Src/MarketScanner.js
          node --check Src/SignalEngine.js

      - name: Token Safety Unit Test
        run: node Src/TokenSafetyScanner.test.js

      - name: Capital Flow Unit Test
        run: node Src/CapitalFlowScanner.test.js

      - name: On-chain Adapter Unit Test
        run: node Src/OnchainDataAdapter.test.js

      - name: On-chain Flow Integration Test
        run: node Src/OnchainFlowIntegration.test.js

      - name: GeckoTerminal Adapter Unit Test
        run: node Src/GeckoTerminalDataAdapter.test.js

      - name: DEX Flow Monitor Unit Test
        run: node Src/DexFlowMonitor.test.js

      - name: Fast Candidate Scorer Unit Test
        run: node Src/FastCandidateScorer.test.js

      - name: Fast Discovery Engine Unit Test
        run: node Src/FastDiscoveryEngine.test.js

      - name: Trade Decision Gate Unit Test
        run: node Src/TradeDecisionGate.test.js

      - name: Statistical Edge Engine Unit Test
        run: node Src/StatisticalEdgeEngine.test.js

      - name: Dashboard Smoke Test
        run: node Src/DashboardServer.test.js

      - name: Paper Bot Smoke Test
        run: npm test
        env:
          BOT_MODE: paper
          ASSET: BTC
          START_BALANCE_USD: 1000
          BUY_DROP_PCT: 2
          SELL_RISE_PCT: 3

      - name: Test completed
        run: echo "Paper bot smoke test completed successfully"
